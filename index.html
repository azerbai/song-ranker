<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discography Sorter</title>
    <meta name="description" content="Rank every song by your favorite artist with head-to-head matchups.">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.0"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B0F19;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.3); border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(139, 92, 246, 0.5); }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col justify-between selection:bg-violet-500 selection:text-white">

    <div id="root" class="w-full flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const STORAGE_KEY = "discographySorter.session.v2";
        const SHARE_URL = "https://azerbai.github.io/song-ranker/";
        const ITUNES = "https://itunes.apple.com";

        // ---------- helpers ----------

        const getJson = async (url) => {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`The music catalog returned an error (${res.status}). Try again in a moment.`);
            return res.json();
        };

        // Collapses "Deluxe", "Remastered", "(Explicit)" etc. so duplicate releases/tracks match.
        const normalizeTitle = (s) => s.toLowerCase()
            .replace(/[(\[][^)\]]*\b(deluxe|explicit|clean|expanded|bonus|remaster(ed)?|anniversary|edition|version|collector'?s)\b[^)\]]*[)\]]/g, "")
            .replace(/\s+-\s+.*\b(deluxe|edition|remaster(ed)?|version|single|ep)\b.*$/, "")
            .replace(/\s+/g, " ")
            .trim();

        const shuffle = (arr) => {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        };

        const bigArt = (url) => (url ? url.replace("100x100", "400x400") : null);

        // ---------- merge sort engine ----------
        // The whole sort is a pure function of (shuffled items, votes), so undo, resume
        // after a refresh, and the progress bar all come from replaying the vote string.

        const initSort = (items) => ({ queue: items.map(t => [t]), li: 0, ri: 0, merged: [] });

        const stepSort = (state, vote) => {
            const { queue, li, ri, merged } = state;
            const [left, right] = queue;
            const out = merged.slice();
            let nl = li, nr = ri;

            if (vote === "l") { out.push(left[li]); nl++; }
            else if (vote === "r") { out.push(right[ri]); nr++; }
            else { out.push(left[li], right[ri]); nl++; nr++; } // tie: keep both, left first

            if (nl >= left.length || nr >= right.length) {
                const done = out.concat(left.slice(nl), right.slice(nr));
                return { queue: [...queue.slice(2), done], li: 0, ri: 0, merged: [] };
            }
            return { queue, li: nl, ri: nr, merged: out };
        };

        const replay = (items, votes) =>
            [...votes].reduce((s, v) => (s.queue.length < 2 ? s : stepSort(s, v)), initSort(items));

        const mergeCost = (sizes) => {
            const q = sizes.slice();
            let total = 0;
            while (q.length > 1) {
                const a = q.shift(), b = q.shift();
                total += a + b - 1;
                q.push(a + b);
            }
            return total;
        };

        const worstCase = (n) => mergeCost(Array(n).fill(1));

        const remainingWorstCase = ({ queue, li, ri }) => {
            if (queue.length < 2) return 0;
            const [a, b] = queue;
            const rest = queue.slice(2).map(q => q.length);
            return (a.length - li) + (b.length - ri) - 1 + mergeCost([...rest, a.length + b.length]);
        };

        // Best available ordering at any moment (exact once the sort is finished).
        const currentRanking = ({ queue, li, ri, merged }) => {
            if (queue.length < 2) return queue[0] || [];
            const [left, right] = queue;
            return [...merged, ...left.slice(li), ...right.slice(ri), ...queue.slice(2).flat()];
        };

        // ---------- persistence ----------

        const loadSession = () => {
            try {
                const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (s && Array.isArray(s.items) && s.items.length > 1 && typeof s.votes === "string" && /^[lrt]*$/.test(s.votes)) return s;
            } catch (e) { /* storage unavailable or corrupt */ }
            return null;
        };
        const saveSession = (s) => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {} };
        const clearSession = () => { try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} };

        // ---------- small components ----------

        function Art({ src, className }) {
            return src
                ? <img src={src} alt="" loading="lazy" className={`object-cover bg-gray-950 ${className}`} />
                : <div className={`bg-gray-950 border border-gray-800 flex items-center justify-center text-gray-600 ${className}`}><i className="fa-solid fa-music"></i></div>;
        }

        function PreviewButton({ track, playing, onToggle, className = "" }) {
            if (!track.preview) return null;
            return (
                <button
                    type="button"
                    onClick={(e) => onToggle(track, e)}
                    aria-label={playing ? "Pause preview" : "Play 30 second preview"}
                    className={`flex items-center justify-center rounded-lg border transition shrink-0 ${
                        playing ? "bg-violet-600 border-violet-500 text-white" : "bg-gray-950/60 border-gray-800 text-gray-400 hover:text-white hover:border-violet-500/40"
                    } ${className}`}
                >
                    <i className={`fa-solid ${playing ? "fa-pause" : "fa-play"} text-xs`}></i>
                </button>
            );
        }

        function TrackCard({ track, onPick, playing, onPreview, keyHint }) {
            return (
                <div
                    role="button"
                    tabIndex={0}
                    onClick={onPick}
                    onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onPick(); } }}
                    className="group bg-gradient-to-b from-gray-900 via-gray-900 to-gray-950 border border-gray-800 hover:border-violet-500/50 focus:outline-none focus:ring-2 focus:ring-violet-500 rounded-2xl p-5 sm:p-7 flex flex-col items-center text-center cursor-pointer md:hover:-translate-y-1 transition-all duration-300 shadow-xl"
                >
                    <Art src={bigArt(track.art)} className="w-28 h-28 sm:w-40 sm:h-40 rounded-xl shadow-lg mb-4 sm:mb-5" />
                    <h3 className="text-lg sm:text-xl font-bold text-white tracking-tight group-hover:text-violet-300 transition break-words">{track.name}</h3>
                    <p className="text-xs text-gray-500 mt-1 line-clamp-1">{track.album}</p>
                    <div className="mt-5 sm:mt-6 w-full flex gap-2">
                        <PreviewButton track={track} playing={playing} onToggle={onPreview} className="w-11" />
                        <div className="flex-1 bg-gray-950/60 border border-gray-800 py-2.5 rounded-xl text-xs font-semibold text-gray-400 group-hover:text-white group-hover:bg-violet-600 transition">
                            Pick this one <span className="hidden sm:inline text-gray-600 group-hover:text-violet-200 ml-1">{keyHint}</span>
                        </div>
                    </div>
                </div>
            );
        }

        function Loading({ status }) {
            return (
                <div className="text-center py-2 text-sm text-violet-400 font-medium animate-pulse">
                    <i className="fa-solid fa-database mr-2"></i> {status}
                </div>
            );
        }

        function ErrorBox({ message }) {
            if (!message) return null;
            return (
                <div className="bg-red-950/40 border border-red-900/50 text-red-400 text-xs p-3 rounded-lg flex items-center gap-2">
                    <i className="fa-solid fa-triangle-exclamation shrink-0"></i>
                    <span>{message}</span>
                </div>
            );
        }

        const primaryBtn = "w-full bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 disabled:from-gray-800 disabled:to-gray-800 disabled:text-gray-500 text-white font-semibold py-4 rounded-xl transition shadow-lg shadow-indigo-600/20 active:scale-[0.99] disabled:cursor-not-allowed disabled:shadow-none flex items-center justify-center gap-2";
        const panel = "bg-gray-900/60 backdrop-blur-xl border border-gray-800/80 rounded-3xl shadow-2xl w-full mx-auto";

        // ---------- app ----------

        function App() {
            const boot = useMemo(loadSession, []);

            const [screen, setScreen] = useState("search"); // search | pick | filter | sort | results
            const [artistQuery, setArtistQuery] = useState("");
            const [isLoading, setIsLoading] = useState(false);
            const [loadingStatus, setLoadingStatus] = useState("");
            const [errorMessage, setErrorMessage] = useState("");

            const [candidates, setCandidates] = useState([]);
            const [artist, setArtist] = useState(null);
            const [selected, setSelected] = useState(new Set());
            const [activeTab, setActiveTab] = useState("albums");

            // The ranking session (persisted).
            const [sessionArtist, setSessionArtist] = useState(boot ? boot.artistName : "");
            const [items, setItems] = useState(boot ? boot.items : []);
            const [votes, setVotes] = useState(boot ? boot.votes : "");
            const [early, setEarly] = useState(boot ? !!boot.early : false);

            const [copied, setCopied] = useState(null);
            const [playingId, setPlayingId] = useState(null);
            const audioRef = useRef(null);

            // ----- derived sort state -----
            const sortState = useMemo(() => replay(items, votes), [items, votes]);
            const isDone = items.length > 1 && sortState.queue.length === 1;
            const ranking = useMemo(() => currentRanking(sortState), [sortState]);
            const worst = useMemo(() => worstCase(items.length), [items]);
            const progress = isDone ? 100
                : worst === 0 ? 0
                : Math.min(99, Math.floor((1 - remainingWorstCase(sortState) / worst) * 100));
            const pair = !isDone && sortState.queue.length > 1
                ? [sortState.queue[0][sortState.li], sortState.queue[1][sortState.ri]]
                : null;

            // ----- audio -----
            const stopAudio = () => {
                if (audioRef.current) audioRef.current.pause();
                setPlayingId(null);
            };

            const togglePreview = (track, e) => {
                e.stopPropagation();
                if (!audioRef.current) {
                    audioRef.current = new Audio();
                    audioRef.current.onended = () => setPlayingId(null);
                }
                const audio = audioRef.current;
                if (playingId === track.id) { stopAudio(); return; }
                audio.src = track.preview;
                audio.play().catch(() => setPlayingId(null));
                setPlayingId(track.id);
            };

            // ----- persistence -----
            useEffect(() => {
                if (items.length > 1) saveSession({ artistName: sessionArtist, items, votes, early });
                else clearSession();
            }, [items, votes, early, sessionArtist]);

            useEffect(() => {
                if (screen === "sort" && isDone) { stopAudio(); setScreen("results"); }
            }, [screen, isDone]);

            // ----- keyboard: ← / → pick, ↓ or T tie, Z undo -----
            useEffect(() => {
                if (screen !== "sort") return;
                const onKey = (e) => {
                    if (e.metaKey || e.altKey || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
                    if (e.key === "ArrowLeft") { e.preventDefault(); vote("l"); }
                    else if (e.key === "ArrowRight") { e.preventDefault(); vote("r"); }
                    else if (e.key === "ArrowDown" || e.key.toLowerCase() === "t") { e.preventDefault(); vote("t"); }
                    else if (e.key.toLowerCase() === "z") { e.preventDefault(); undo(); }
                };
                window.addEventListener("keydown", onKey);
                return () => window.removeEventListener("keydown", onKey);
            }, [screen, votes, isDone]);

            // ----- search & load -----
            const searchArtist = async (e) => {
                if (e) e.preventDefault();
                const query = artistQuery.trim();
                if (!query) return;

                setIsLoading(true);
                setErrorMessage("");
                setLoadingStatus("Searching for artist...");
                try {
                    const data = await getJson(`${ITUNES}/search?term=${encodeURIComponent(query)}&entity=musicArtist&limit=6`);
                    const seen = new Set();
                    const results = (data.results || []).filter(r => r.artistId && !seen.has(r.artistId) && seen.add(r.artistId));
                    if (results.length === 0) throw new Error(`Could not find an artist matching "${query}"`);

                    if (results.length === 1 || results[0].artistName.toLowerCase() === query.toLowerCase()) {
                        await loadDiscography(results[0]);
                    } else {
                        setCandidates(results);
                        setScreen("pick");
                        setIsLoading(false);
                        setLoadingStatus("");
                    }
                } catch (error) {
                    setErrorMessage(error.message || "Something went wrong while searching.");
                    setIsLoading(false);
                    setLoadingStatus("");
                }
            };

            const loadDiscography = async (target) => {
                setIsLoading(true);
                setErrorMessage("");
                setLoadingStatus(`Loading ${target.artistName}'s catalog...`);
                try {
                    const albumsData = await getJson(`${ITUNES}/lookup?id=${target.artistId}&entity=album&limit=200`);
                    const raw = (albumsData.results || []).filter(item =>
                        item.wrapperType === "collection" &&
                        !/tribute|karaoke/i.test(item.collectionName)
                    );
                    if (raw.length === 0) throw new Error("No musical projects were found for this artist.");

                    const albums = [], singles = [], seen = new Set();
                    raw.forEach(item => {
                        const key = normalizeTitle(item.collectionName);
                        if (seen.has(key)) return;
                        seen.add(key);
                        const isSingleOrEP = item.trackCount <= 6 || /single|- ep$/i.test(item.collectionName);
                        (isSingleOrEP ? singles : albums).push(item);
                    });
                    const byDate = (a, b) => new Date(b.releaseDate) - new Date(a.releaseDate);
                    albums.sort(byDate);
                    singles.sort(byDate);

                    const total = albums.length + singles.length;
                    let done = 0;
                    const fetchGroup = async (album) => {
                        try {
                            const data = await getJson(`${ITUNES}/lookup?id=${album.collectionId}&entity=song`);
                            const tracks = (data.results || [])
                                .filter(r => r.wrapperType === "track" && r.kind === "song")
                                .sort((a, b) => (a.discNumber || 1) - (b.discNumber || 1) || a.trackNumber - b.trackNumber)
                                .map(r => ({ name: r.trackName, preview: r.previewUrl || null }));
                            return {
                                title: `${album.collectionName} (${new Date(album.releaseDate).getFullYear()})`,
                                art: album.artworkUrl100 || null,
                                tracks,
                            };
                        } catch (err) {
                            return null;
                        } finally {
                            setLoadingStatus(`Assembling tracklists (${++done} / ${total})...`);
                        }
                    };

                    // Small batches keep the (unauthenticated) API happy.
                    const fetchAll = async (list) => {
                        const out = [];
                        for (let i = 0; i < list.length; i += 6) {
                            out.push(...await Promise.all(list.slice(i, i + 6).map(fetchGroup)));
                            if (i + 6 < list.length) await new Promise(r => setTimeout(r, 100));
                        }
                        return out.filter(g => g && g.tracks.length > 0);
                    };

                    const finalAlbums = await fetchAll(albums);
                    const finalSingles = await fetchAll(singles);
                    if (finalAlbums.length + finalSingles.length === 0) throw new Error("No tracklists could be loaded for this artist.");

                    setArtist({ name: target.artistName, albums: finalAlbums, singles: finalSingles });
                    setSelected(new Set(finalAlbums.slice(0, 3).map(a => a.title)));
                    setActiveTab(finalAlbums.length > 0 ? "albums" : "singles");
                    setScreen("filter");
                } catch (error) {
                    setErrorMessage(error.message || "An error occurred while fetching the discography data.");
                    setScreen("search");
                } finally {
                    setIsLoading(false);
                    setLoadingStatus("");
                }
            };

            // ----- filter screen -----
            const selectionItems = useMemo(() => {
                if (!artist) return [];
                const seen = new Set();
                const out = [];
                [...artist.albums, ...artist.singles].forEach(group => {
                    if (!selected.has(group.title)) return;
                    group.tracks.forEach(t => {
                        const key = normalizeTitle(t.name);
                        if (seen.has(key)) return;
                        seen.add(key);
                        out.push({ id: `t${out.length}`, name: t.name, album: group.title, art: group.art, preview: t.preview });
                    });
                });
                return out;
            }, [artist, selected]);

            const toggleCollection = (title) => {
                const next = new Set(selected);
                next.has(title) ? next.delete(title) : next.add(title);
                setSelected(next);
            };

            const setTabSelection = (on) => {
                const next = new Set(selected);
                artist[activeTab].forEach(g => on ? next.add(g.title) : next.delete(g.title));
                setSelected(next);
            };

            const startSorting = () => {
                if (selectionItems.length < 2) return;
                stopAudio();
                setItems(shuffle(selectionItems));
                setVotes("");
                setEarly(false);
                setSessionArtist(artist.name);
                setScreen("sort");
            };

            // ----- voting -----
            function vote(v) {
                if (isDone) return;
                stopAudio();
                setVotes(prev => prev + v);
            }

            function undo() {
                if (votes.length === 0) return;
                stopAudio();
                setVotes(prev => prev.slice(0, -1));
                setEarly(false);
                setScreen("sort");
            }

            // ----- navigation -----
            const goHome = () => { stopAudio(); setErrorMessage(""); setScreen("search"); };

            const startOver = () => {
                stopAudio();
                setItems([]);
                setVotes("");
                setEarly(false);
                setSessionArtist("");
                setArtist(null);
                setArtistQuery("");
                setErrorMessage("");
                setScreen("search");
            };

            const resume = () => setScreen(isDone || early ? "results" : "sort");

            // ----- sharing -----
            const buildCard = (topN, bottomN) => {
                const total = ranking.length;
                const top = ranking.slice(0, Math.min(topN, total));
                const bottomCount = Math.min(bottomN, Math.max(0, total - top.length));
                let text = `💿 My ${sessionArtist} Discography Rank:\n\n🏆 TOP:\n`;
                top.forEach((t, i) => { text += `${i + 1}. ${t.name}\n`; });
                if (bottomCount > 0) {
                    text += `\n📉 BOTTOM:\n`;
                    ranking.slice(-bottomCount).forEach((t, i) => { text += `${total - bottomCount + i + 1}. ${t.name}\n`; });
                }
                return text + `\nSort yours here: ${SHARE_URL}`;
            };

            // Tweets count every URL as 23 characters; trim the card until it fits.
            const tweetLength = (s) => s.replace(SHARE_URL, "x".repeat(23)).length;

            const handleTwitterShare = () => {
                const text = [[5, 5], [5, 0], [3, 0], [1, 0]].map(([t, b]) => buildCard(t, b)).find(c => tweetLength(c) <= 280)
                    || buildCard(1, 0);
                window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, "_blank", "noopener,noreferrer");
            };

            const copy = (key, text) => {
                navigator.clipboard.writeText(text).then(() => {
                    setCopied(key);
                    setTimeout(() => setCopied(null), 2500);
                }).catch(() => {});
            };

            const fullRankingText = () =>
                `💿 ${sessionArtist} – my full ranking:\n\n` +
                ranking.map((t, i) => `${i + 1}. ${t.name}`).join("\n") +
                `\n\nSort yours here: ${SHARE_URL}`;

            // ----- render -----
            const choicesMade = votes.length;

            return (
                <div className="flex flex-col flex-grow w-full max-w-4xl mx-auto px-4 py-6 sm:py-8 justify-center">

                    {/* HEADER */}
                    <header className="text-center mb-6 sm:mb-8 flex flex-col items-center justify-center">
                        <button type="button" className="flex items-center gap-3 cursor-pointer" onClick={goHome}>
                            <div className="bg-gradient-to-tr from-violet-600 to-indigo-600 p-2.5 rounded-xl shadow-lg shadow-indigo-500/20">
                                <i className="fa-solid fa-compact-disc text-2xl text-white"></i>
                            </div>
                            <h1 className="text-2xl sm:text-3xl font-bold tracking-tight bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-transparent">
                                Discography Sorter
                            </h1>
                        </button>
                        <p className="text-xs text-gray-400 mt-2 tracking-wide uppercase font-medium">Rank your favorite music track by track</p>
                    </header>

                    {/* SEARCH */}
                    {screen === "search" && (
                        <div className="max-w-xl w-full mx-auto space-y-4">
                            {items.length > 1 && !isLoading && (
                                <div className="bg-violet-950/20 border border-violet-500/30 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                    <div className="min-w-0">
                                        <p className="text-sm font-bold text-white truncate">
                                            {isDone ? "Finished" : "In progress"}: {sessionArtist}
                                        </p>
                                        <p className="text-xs text-gray-400 mt-0.5">
                                            {items.length} songs · {choicesMade} choices made{isDone ? "" : ` · ${progress}% done`}
                                        </p>
                                    </div>
                                    <div className="flex gap-2 shrink-0">
                                        <button onClick={resume} className="bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold px-4 py-2.5 rounded-lg transition">
                                            {isDone || early ? "View results" : "Resume"}
                                        </button>
                                        <button onClick={startOver} className="bg-gray-900 border border-gray-800 text-gray-400 hover:text-white text-xs font-semibold px-4 py-2.5 rounded-lg transition">
                                            Discard
                                        </button>
                                    </div>
                                </div>
                            )}

                            <div className={`${panel} p-6 sm:p-8`}>
                                <h2 className="text-2xl font-bold text-center text-white mb-2">Search for an Artist</h2>
                                <p className="text-gray-400 text-sm text-center mb-8">Enter any artist name to automatically pull their complete album history and tracklists.</p>

                                <form onSubmit={searchArtist} className="space-y-6">
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-500">
                                            {isLoading ? <i className="fa-solid fa-circle-notch animate-spin text-violet-500"></i> : <i className="fa-solid fa-magnifying-glass"></i>}
                                        </div>
                                        <input
                                            type="text"
                                            autoFocus
                                            disabled={isLoading}
                                            placeholder="Enter artist name (e.g., Drake, Lana Del Rey...)"
                                            className="w-full bg-gray-950 border border-gray-800 text-white rounded-xl py-4 pl-12 pr-4 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition-all placeholder:text-gray-600 shadow-inner disabled:opacity-60"
                                            value={artistQuery}
                                            onChange={(e) => setArtistQuery(e.target.value)}
                                        />
                                    </div>

                                    {isLoading && <Loading status={loadingStatus} />}
                                    <ErrorBox message={errorMessage} />

                                    <button type="submit" disabled={isLoading || !artistQuery.trim()} className={primaryBtn}>
                                        {isLoading ? "Loading Catalog..." : "Load Discography"} <i className="fa-solid fa-arrow-right text-sm"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ARTIST PICKER */}
                    {screen === "pick" && (
                        <div className={`${panel} p-6 sm:p-8 max-w-xl`}>
                            <div className="flex items-center gap-4 mb-6">
                                <button onClick={goHome} className="text-gray-400 hover:text-white bg-gray-800/50 p-2.5 rounded-lg border border-gray-700/50 transition" aria-label="Back">
                                    <i className="fa-solid fa-arrow-left"></i>
                                </button>
                                <div>
                                    <h2 className="text-xl font-bold text-white">Which artist?</h2>
                                    <p className="text-gray-400 text-xs">Several matches for "{artistQuery}"</p>
                                </div>
                            </div>
                            <div className="space-y-2">
                                {candidates.map(c => (
                                    <button
                                        key={c.artistId}
                                        disabled={isLoading}
                                        onClick={() => loadDiscography(c)}
                                        className="w-full text-left flex items-center justify-between p-4 rounded-xl border bg-gray-950/40 border-gray-800/80 hover:border-violet-500/40 hover:bg-violet-950/20 transition disabled:opacity-50"
                                    >
                                        <span className="font-medium text-sm text-white truncate">{c.artistName}</span>
                                        <span className="text-xs text-gray-500 shrink-0 ml-3">{c.primaryGenreName || ""}</span>
                                    </button>
                                ))}
                            </div>
                            {isLoading && <div className="mt-4"><Loading status={loadingStatus} /></div>}
                        </div>
                    )}

                    {/* FILTER */}
                    {screen === "filter" && artist && (
                        <div className={`${panel} p-6 sm:p-8 max-w-2xl`}>
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-5 pb-4 border-b border-gray-800/60">
                                <div className="flex items-center gap-4 min-w-0">
                                    <button onClick={goHome} className="text-gray-400 hover:text-white bg-gray-800/50 p-2.5 rounded-lg border border-gray-700/50 transition shrink-0" aria-label="Back">
                                        <i className="fa-solid fa-arrow-left"></i>
                                    </button>
                                    <div className="min-w-0">
                                        <h2 className="text-2xl font-bold text-white truncate">{artist.name}</h2>
                                        <p className="text-gray-400 text-xs uppercase tracking-wider font-semibold">Select items to include</p>
                                    </div>
                                </div>

                                <div className="flex bg-gray-950 p-1 rounded-xl border border-gray-800/80 self-start sm:self-auto shrink-0">
                                    {[["albums", "Albums"], ["singles", "Singles & EPs"]].map(([key, label]) => (
                                        <button
                                            key={key}
                                            onClick={() => setActiveTab(key)}
                                            className={`px-4 py-2 rounded-lg text-xs font-semibold transition ${activeTab === key ? "bg-violet-600 text-white" : "text-gray-400 hover:text-gray-200"}`}
                                        >
                                            {label} ({artist[key].length})
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="flex items-center justify-between mb-3 text-xs">
                                <span className="text-gray-500">{selected.size} selected</span>
                                <div className="flex gap-3 font-semibold">
                                    <button onClick={() => setTabSelection(true)} className="text-violet-400 hover:text-violet-300">Select all</button>
                                    <button onClick={() => setTabSelection(false)} className="text-gray-500 hover:text-gray-300">Clear</button>
                                </div>
                            </div>

                            <div className="space-y-2 mb-6 max-h-96 overflow-y-auto pr-2 custom-scrollbar">
                                {artist[activeTab].length === 0 && (
                                    <p className="text-sm text-gray-500 text-center py-8">Nothing here for this artist.</p>
                                )}
                                {artist[activeTab].map((group) => {
                                    const isChecked = selected.has(group.title);
                                    return (
                                        <div
                                            key={group.title}
                                            onClick={() => toggleCollection(group.title)}
                                            className={`flex items-center justify-between gap-3 p-3 rounded-xl border cursor-pointer transition select-none ${
                                                isChecked ? "bg-violet-950/20 border-violet-500/40 text-white" : "bg-gray-950/40 border-gray-800/80 text-gray-400 hover:border-gray-700"
                                            }`}
                                        >
                                            <div className="flex items-center gap-3 min-w-0">
                                                <Art src={group.art} className="w-11 h-11 rounded-lg shrink-0" />
                                                <span className="font-medium text-sm truncate">{group.title}</span>
                                            </div>
                                            <div className="flex items-center gap-3 shrink-0">
                                                <span className="text-xs bg-gray-800 text-gray-400 px-2.5 py-1 rounded-md border border-gray-700/40">{group.tracks.length} songs</span>
                                                <div className={`w-5 h-5 rounded-md flex items-center justify-center border transition ${isChecked ? "bg-violet-600 border-violet-500 text-white" : "border-gray-600"}`}>
                                                    {isChecked && <i className="fa-solid fa-check text-[10px]"></i>}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            <p className="text-center text-xs text-gray-500 mb-3 h-4">
                                {selectionItems.length >= 2
                                    ? `${selectionItems.length} unique songs · up to ~${worstCase(selectionItems.length)} matchups`
                                    : "Select at least 2 songs' worth of releases"}
                            </p>

                            <button onClick={startSorting} disabled={selectionItems.length < 2} className={primaryBtn}>
                                <i className="fa-solid fa-play text-xs"></i> Start Sorting Selected Songs
                            </button>
                        </div>
                    )}

                    {/* MATCHUP */}
                    {screen === "sort" && pair && (
                        <div className="w-full space-y-5 max-w-3xl mx-auto">
                            <div className="bg-gray-900/40 backdrop-blur-md border border-gray-800/80 rounded-2xl p-4 sm:p-5 shadow-xl">
                                <div className="flex justify-between items-center text-xs sm:text-sm font-semibold mb-2">
                                    <span className="text-violet-400 truncate pr-2">{sessionArtist}</span>
                                    <span className="text-gray-400 shrink-0">Matchup {choicesMade + 1} · {progress}%</span>
                                </div>
                                <div className="w-full bg-gray-950 h-2.5 rounded-full overflow-hidden border border-gray-800/40 p-0.5">
                                    <div
                                        className="bg-gradient-to-r from-violet-500 to-indigo-500 h-full rounded-full transition-all duration-300 ease-out"
                                        style={{ width: `${progress}%` }}
                                    ></div>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                                <TrackCard track={pair[0]} onPick={() => vote("l")} playing={playingId === pair[0].id} onPreview={togglePreview} keyHint="←" />
                                <TrackCard track={pair[1]} onPick={() => vote("r")} playing={playingId === pair[1].id} onPreview={togglePreview} keyHint="→" />
                            </div>

                            <div className="flex flex-wrap gap-3 justify-between items-center pt-1">
                                <button
                                    onClick={undo}
                                    disabled={votes.length === 0}
                                    className="flex items-center gap-2 px-5 py-3 rounded-xl border text-sm font-semibold transition bg-gray-900/60 border-gray-800 text-gray-300 hover:text-white hover:bg-gray-800 disabled:bg-gray-950/20 disabled:border-gray-900 disabled:text-gray-600 disabled:cursor-not-allowed"
                                >
                                    <i className="fa-solid fa-rotate-left text-xs"></i> Undo <span className="hidden sm:inline text-gray-600">Z</span>
                                </button>
                                <div className="flex gap-3">
                                    <button onClick={() => vote("t")} className="bg-gray-900/60 border border-gray-800 text-gray-300 hover:text-white hover:bg-gray-800 px-5 py-3 rounded-xl text-sm font-semibold transition">
                                        Tie <span className="hidden sm:inline text-gray-600">↓</span>
                                    </button>
                                    <button
                                        onClick={() => { stopAudio(); setEarly(true); setScreen("results"); }}
                                        className="bg-emerald-950/20 hover:bg-emerald-900/30 border border-emerald-800/40 text-emerald-400 hover:text-emerald-300 px-5 py-3 rounded-xl text-sm font-semibold transition"
                                    >
                                        Finish Early
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* RESULTS */}
                    {screen === "results" && (
                        <div className={`${panel} p-5 sm:p-8 max-w-2xl`}>
                            <div className="text-center mb-6">
                                <div className="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800/50 mb-3 shadow-lg">
                                    <i className="fa-solid fa-crown text-xl"></i>
                                </div>
                                <h2 className="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Your {sessionArtist} Ranking</h2>
                                <p className="text-gray-400 text-sm mt-1">{ranking.length} songs · {choicesMade} choices</p>
                            </div>

                            {!isDone && (
                                <div className="bg-amber-950/20 border border-amber-800/40 text-amber-300 text-xs p-3 rounded-xl mb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                    <span><i className="fa-solid fa-circle-info mr-2"></i>Partial result: you stopped at {progress}%, so only songs you've compared are reliably ordered.</span>
                                    <button
                                        onClick={() => { setEarly(false); setScreen("sort"); }}
                                        className="bg-amber-600/20 hover:bg-amber-600/30 border border-amber-700/40 text-amber-200 font-semibold px-4 py-2 rounded-lg transition shrink-0"
                                    >
                                        Keep sorting
                                    </button>
                                </div>
                            )}

                            <div className="bg-gray-950/80 border border-gray-800/80 rounded-2xl p-4 mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
                                <div className="flex items-center gap-3 text-center sm:text-left">
                                    <div className="w-10 h-10 rounded-xl bg-violet-600/10 border border-violet-500/20 items-center justify-center text-violet-400 shrink-0 hidden sm:flex">
                                        <i className="fa-solid fa-share-nodes"></i>
                                    </div>
                                    <div>
                                        <h4 className="text-sm font-bold text-white">Share Your Standings</h4>
                                        <p className="text-xs text-gray-500 mt-0.5">Post your top & bottom tracks, or copy the whole list.</p>
                                    </div>
                                </div>
                                <div className="flex flex-wrap items-center gap-2.5 w-full sm:w-auto justify-center">
                                    <button onClick={handleTwitterShare} className="flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-white text-black hover:bg-gray-200 font-bold text-xs transition shadow-md shrink-0">
                                        <i className="fa-brands fa-x-twitter text-sm"></i> Post
                                    </button>
                                    {[["card", "Copy Top/Bottom", () => buildCard(5, 5)], ["full", "Copy Full List", fullRankingText]].map(([key, label, getText]) => (
                                        <button
                                            key={key}
                                            onClick={() => copy(key, getText())}
                                            className={`flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl border font-bold text-xs transition shrink-0 ${
                                                copied === key ? "bg-emerald-950/40 border-emerald-500/30 text-emerald-400" : "bg-gray-900 border-gray-800 text-gray-300 hover:text-white hover:bg-gray-800"
                                            }`}
                                        >
                                            {copied === key ? <><i className="fa-solid fa-check"></i> Copied!</> : <><i className="fa-solid fa-copy"></i> {label}</>}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="space-y-2 max-h-[420px] overflow-y-auto pr-2 mb-6 custom-scrollbar">
                                {ranking.map((song, index) => {
                                    const badge =
                                        index === 0 ? "bg-amber-500/10 text-amber-400 border-amber-500/30" :
                                        index === 1 ? "bg-slate-300/10 text-slate-300 border-slate-400/30" :
                                        index === 2 ? "bg-amber-700/10 text-amber-600 border-amber-800/30" :
                                        "bg-gray-950 text-gray-500 border-gray-800/60";
                                    return (
                                        <div
                                            key={song.id}
                                            className={`flex items-center justify-between gap-3 p-3 rounded-xl border ${
                                                index === 0 ? "bg-gradient-to-r from-amber-500/5 via-transparent to-transparent border-amber-500/20" : "bg-gray-950/40 border-gray-800/60"
                                            }`}
                                        >
                                            <div className="flex items-center gap-3 min-w-0">
                                                <div className={`min-w-9 h-7 px-1 rounded-lg flex items-center justify-center font-bold text-xs border shrink-0 ${badge}`}>
                                                    #{index + 1}
                                                </div>
                                                <Art src={song.art} className="w-10 h-10 rounded-md shrink-0" />
                                                <div className="min-w-0">
                                                    <h4 className="font-bold text-sm text-gray-100 truncate">{song.name}</h4>
                                                    <p className="text-xs text-gray-500 truncate mt-0.5">{song.album}</p>
                                                </div>
                                            </div>
                                            <PreviewButton track={song} playing={playingId === song.id} onToggle={togglePreview} className="w-9 h-9" />
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="flex flex-col sm:flex-row gap-3">
                                {isDone && votes.length > 0 && (
                                    <button onClick={undo} className="sm:w-auto bg-gray-900/60 border border-gray-800 text-gray-300 hover:text-white hover:bg-gray-800 font-semibold py-4 px-6 rounded-xl transition flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-rotate-left text-xs"></i> Undo last choice
                                    </button>
                                )}
                                <button onClick={startOver} className="flex-1 bg-gray-800 hover:bg-gray-700 text-white font-semibold py-4 rounded-xl transition flex items-center justify-center gap-2 border border-gray-700/60">
                                    <i className="fa-solid fa-arrow-rotate-right text-xs"></i> Sort Another Discography
                                </button>
                            </div>
                        </div>
                    )}

                    <footer className="mt-10 text-center text-[11px] font-semibold text-gray-600 tracking-wider uppercase">
                        Merge sort in your browser · Catalog &amp; previews from iTunes
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
